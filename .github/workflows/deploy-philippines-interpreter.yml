# 박준철 통역사 사이트(interpreter-sample/)를 Cloudflare Pages "philippines-interpreter" 프로젝트에 자동 배포합니다.
# 필요한 GitHub 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy Philippines interpreter site

on:
  push:
    branches: [ccr-587b9360-borpmp]
    paths:
      - "interpreter-sample/**"
      - ".github/workflows/deploy-philippines-interpreter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-philippines-interpreter
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Cloudflare Pages project if missing
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages project create philippines-interpreter --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy interpreter-sample --project-name=philippines-interpreter --branch=main --commit-dirty=true

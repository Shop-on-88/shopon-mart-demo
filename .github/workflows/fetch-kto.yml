# 한국관광공사 관광사진 정보에서 봉화 사진을 받아 커밋합니다.
# 필요한 GitHub 저장소 Secret: TOUR_API_KEY (공공데이터포털 일반 인증키 Decoding)
name: Fetch KTO photos

on:
  push:
    branches: [ccr-2fa5efbb-1tt6pg]
    paths:
      - "tools/fetch_kto.py"
      - "tools/kto-pick.json"
      - ".github/workflows/fetch-kto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Fetch
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          if [ -f tools/kto-pick.json ]; then python3 tools/fetch_kto.py pick; else python3 tools/fetch_kto.py catalog; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/kto-candidates tools/kto-catalog.json jagalmadang/images/places 2>/dev/null || true
          git commit -m "관광공사 사진 받기" || exit 0
          git push

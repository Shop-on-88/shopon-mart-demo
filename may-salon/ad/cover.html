<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
html,body{margin:0}
.c{position:relative;width:1640px;height:924px;background:#0e0c0a;overflow:hidden;font-family:"IBM Plex Sans KR",sans-serif;color:#f4ead6}
.glow{position:absolute;inset:0;background:radial-gradient(50% 70% at 25% 50%,rgba(201,164,92,.16),transparent 70%)}
.tiles{position:absolute;right:0;top:0;bottom:0;width:860px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px}
.tiles div{background-size:cover;background-position:center}
.tiles::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0e0c0a 0%,rgba(14,12,10,.6) 18%,rgba(14,12,10,0) 40%);z-index:1}
.txt{position:absolute;left:110px;top:150px;height:624px;width:720px;display:flex;flex-direction:column;justify-content:center;z-index:2}
.eb{font:700 22px "IBM Plex Sans KR";letter-spacing:.28em;color:#c9a45c;text-transform:uppercase}
h1{margin:14px 0 0;font:500 118px/0.95 "Cormorant Garamond",serif;font-style:italic;color:#e9cf93}
.sub{font:600 30px "Cormorant Garamond",serif;letter-spacing:.32em;text-transform:uppercase;margin-top:14px;color:#f4ead6}
.svc{margin-top:30px;font:500 28px "IBM Plex Sans KR";color:#f4ead6}
.info{margin-top:26px;display:flex;gap:14px;flex-wrap:wrap}
.info span{border:1px solid rgba(201,164,92,.6);border-radius:999px;padding:10px 22px;font:500 22px "IBM Plex Sans KR"}
.info .gold{background:#c9a45c;color:#15100a;border-color:#c9a45c;font-weight:700}
</style></head><body>
<div class="c"><div class="glow"></div>
<div class="tiles"><div style="background-image:url(../site/img/s1.jpg);background-position:40% 60%"></div><div style="background-image:url(../site/img/p02.jpg)"></div><div style="background-image:url(../site/img/p23.jpg)"></div></div>

 <div class="eb">Korean Hair Salon · Angeles City</div>

 <div class="sub">Hair Salon</div>
 <div class="svc">Korean Perm · Color · Men · Kids · Nails · Lashes</div>
 <div class="info"><span class="gold">📞 0947 784 1312</span><span>Open daily 9AM–7PM</span><span>2F Fil-Am Friendship Hwy</span></div>
</div></div></body></html>

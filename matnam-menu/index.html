  @page { size: A4; margin: 0; }
  :root {
    --paper: #f5eee1;
    --paper-deep: #ebe0cc;
    --ink: #1f1b17;
    --muted: #6f655a;
    --line: #cbbda5;
    --red: #b8322a;
    --gold: #a77b2c;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #8d8476; }
  body {
    font-family: "Noto Sans KR", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page {
    width: 210mm; height: 297mm;
    margin: 10mm auto;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    padding: 14mm 15mm 13mm;
    display: flex; flex-direction: column;
    box-shadow: 0 4px 24px rgba(0,0,0,.25);
  }
  @media print {
    html { background: none; }
    .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
  }
  /* 테두리 장식 */
  .page::before {
    content: ""; position: absolute; inset: 7mm;
    border: 0.4mm solid var(--line); pointer-events: none;
  }
  .page::after {
    content: ""; position: absolute; inset: 8.4mm;
    border: 0.15mm solid var(--line); pointer-events: none;
  }

  /* ---------- 섹션 헤더 ---------- */
  .head { text-align: center; margin-bottom: 5mm; }
  .head .no {
    font-family: "Cormorant Garamond", serif; font-style: italic;
    color: var(--gold); font-size: 12pt; letter-spacing: .5px;
  }
  .head h2 {
    font-family: "Noto Serif KR", serif; font-weight: 900;
    font-size: 26pt; letter-spacing: 6px; line-height: 1.15;
  }
  .head .en {
    font-family: "Cormorant Garamond", serif; font-weight: 600;
    font-size: 11pt; letter-spacing: 6px; color: var(--red); text-transform: uppercase;
  }
  .head .rule {
    display: flex; align-items: center; gap: 3mm; justify-content: center; margin-top: 2.5mm;
  }
  .head .rule span { height: .3mm; width: 22mm; background: var(--ink); }
  .head .rule i { width: 2.2mm; height: 2.2mm; background: var(--red); transform: rotate(45deg); }
  .head .note { margin-top: 2mm; font-size: 8.5pt; color: var(--muted); }

  /* ---------- 본문 ---------- */
  .body { flex: 1; display: flex; flex-direction: column; }
  .group { margin-bottom: 4.5mm; }
  .group h3 {
    display: flex; align-items: baseline; gap: 2.5mm;
    font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 12pt;
    padding-bottom: 1.3mm; margin-bottom: 3mm;
    border-bottom: .45mm solid var(--ink);
  }
  .group h3 small {
    font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 9.5pt;
    letter-spacing: 2.5px; color: var(--red); text-transform: uppercase;
  }

  /* 사진 카드 */
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 3.2mm 4mm; }
  .card { display: flex; flex-direction: column; }
  .card .ph {
    position: relative; aspect-ratio: var(--ratio, 4 / 3); border-radius: 1.6mm; overflow: hidden;
    background: var(--paper-deep); box-shadow: 0 .4mm 1.2mm rgba(60,40,20,.18);
  }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .ph .tag {
    position: absolute; top: 1.4mm; left: 1.4mm;
    font-size: 6.5pt; font-weight: 700; color: #fff; background: var(--red);
    border-radius: .8mm; padding: .2mm 1.3mm; letter-spacing: .5px;
  }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1.5mm; margin-top: 1.6mm; }
  .card .ko { font-weight: 700; font-size: 9.8pt; line-height: 1.25; white-space: pre-line; }
  .card .price { font-weight: 700; font-size: 9.8pt; color: var(--red); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card .price small { font-weight: 500; font-size: 7pt; color: var(--muted); margin: 0 .4mm 0 1.2mm; }
  .card .price small:first-child { margin-left: 0; }
  .card .en { font-size: 6.6pt; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; line-height: 1.35; margin-top: .3mm; }
  .card .incl { font-size: 7pt; color: var(--gold); font-weight: 700; margin-top: .4mm; }
  .card.check .price { background: #ffe58a; color: var(--ink); padding: 0 1mm; }

  /* 큰 카드 (요리 페이지) */
  .big .card .ko, .big .card .price { font-size: 11pt; }
  .big .card .en { font-size: 7.2pt; }

  /* 텍스트 목록 (음료) */
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 11mm; align-items: start; }
  .item { display: grid; grid-template-columns: auto 1fr auto; align-items: end; column-gap: 2mm; padding: 1.55mm 0; }
  .item .ko { font-weight: 700; font-size: 11pt; white-space: nowrap; }
  .item .dots { border-bottom: .35mm dotted var(--line); transform: translateY(-1.6mm); }
  .item .price { font-weight: 700; font-size: 11pt; white-space: nowrap; }
  .item .price .cur { font-weight: 500; font-size: 8.5pt; color: var(--muted); margin-right: .6mm; }
  .item .en { grid-column: 1 / -1; font-size: 7.6pt; letter-spacing: .6px; color: var(--muted); text-transform: uppercase; margin-top: .3mm; }

  /* 추가 옵션 */
  .addons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2.5mm; }
  .addon { background: var(--paper-deep); border-radius: 1.6mm; padding: 2mm 2.5mm; text-align: center; }
  .addon div { font-size: 9.5pt; font-weight: 700; }
  .addon small { display: block; font-size: 6.5pt; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
  .addon b { display: block; color: var(--red); font-size: 10pt; margin-top: .6mm; }

  .shake { display: flex; flex-wrap: wrap; gap: 1.6mm; margin-top: 1mm; grid-column: 1 / -1; }
  .shake span { font-size: 8.8pt; background: var(--paper-deep); border-radius: 5mm; padding: .7mm 2.6mm; }
  .shake span small { color: var(--muted); font-size: 7pt; margin-left: 1mm; text-transform: uppercase; }

  /* 음료 페이지 하단 사진 띠 */
  .strip { margin-top: auto; margin-bottom: 4mm; }
  .strip p { text-align: center; font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 11pt; margin-bottom: 3mm; }
  .strip p small { display: block; font-family: "Cormorant Garamond", serif; font-size: 9.5pt; color: var(--red); letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }
  .strip .imgs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3mm; }
  .strip img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 1.6mm; display: block; }

  /* ---------- 하단 ---------- */
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 8pt; color: var(--muted); border-top: .25mm solid var(--line); padding-top: 2.2mm; margin-top: auto;
  }
  .foot .brand { font-family: "Nanum Brush Script", cursive; font-size: 16pt; color: var(--ink); line-height: 1; }

  /* ---------- 표지 ---------- */
  .cover { background: #1f1b17; color: var(--paper); padding: 0; }
  .cover::before, .cover::after { border-color: rgba(245,238,225,.35); z-index: 2; }
  .cover .mosaic {
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr);
    height: 82mm; gap: 1.2mm; position: relative;
  }
  .cover .mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .mosaic::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(31,27,23,0) 45%, #1f1b17 100%);
  }
  .cover .inner {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 0 20mm; margin-top: -8mm; position: relative;
  }
  .cover .since {
    font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 15pt; letter-spacing: 4px; color: #d8b26a;
  }
  .cover h1 {
    font-family: "Nanum Brush Script", cursive; font-weight: 400;
    font-size: 96pt; line-height: .95; letter-spacing: 2px; margin: 3mm 0 2mm;
  }
  .cover .tagline {
    font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 13pt; letter-spacing: 7px; text-transform: uppercase;
  }
  .cover .div { display: flex; align-items: center; gap: 3mm; margin: 9mm 0 7mm; }
  .cover .div span { width: 30mm; height: .3mm; background: rgba(245,238,225,.5); }
  .cover .div i { width: 2.4mm; height: 2.4mm; background: var(--red); transform: rotate(45deg); }
  .cover .toc { display: grid; grid-template-columns: repeat(3, auto); gap: 3mm 10mm; font-size: 10.5pt; }
  .cover .toc div { display: flex; gap: 2.5mm; align-items: baseline; }
  .cover .toc b { font-family: "Noto Serif KR", serif; font-weight: 700; }
  .cover .toc small { font-family: "Cormorant Garamond", serif; color: #d8b26a; letter-spacing: 1.5px; font-size: 9.5pt; text-transform: uppercase; }
  .cover .info {
    display: flex; justify-content: center; gap: 12mm; padding: 0 20mm 16mm; font-size: 9.5pt; color: rgba(245,238,225,.8);

  .cover .info { align-items: center; }
  .cover .wifi { display: flex; align-items: center; gap: 3.5mm; text-align: left; }
  .cover .wifi img { width: 22mm; height: 22mm; border-radius: 1.5mm; display: block; }
  .cover .info small { display: block; white-space: nowrap; font-size: 7.5pt; color: rgba(245,238,225,.65); margin-top: .8mm; line-height: 1.4; }

      { ko: "주류", en: "Liquor", items: [
        { ko: "소주", en: "Soju", p: 250 },
        { ko: "진로 이즈백", en: "Jinro Is Back Soju", p: 280 },
        { ko: "막걸리", en: "Korean Rice Wine", p: 250 },
        { ko: "복분자", en: "Black Raspberry Wine", p: 750 },
        { ko: "맥주", en: "San Miguel Light / Pilsen", p: 100 },
      ]},
      { ko: "음료", en: "Non-Alcoholic", items: [
        { ko: "아이스 아메리카노", en: "Iced Americano", p: 100 },
        { ko: "음료수", en: "Coke / Sprite / Royal", p: 80 },
        { ko: "생수", en: "Bottled Water", p: 50 },
        { ko: "과일 쉐이크", en: "Fruit Shake", p: 180, shake: [
          ["아보카도", "Avocado"], ["딸기", "Strawberry"], ["망고", "Mango"],
          ["그린망고", "Green Mango"], ["키위", "Kiwi"], ["수박", "Watermelon"], ["레몬", "Lemon"],
        ]},
      ]},
    ],
  },
];

/* ─── 렌더링 ─────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const peso = n => "₱" + n.toLocaleString("en-US");
const src = name => `img/${name}.jpg`;

function cardHTML(it) {
  let price;
  if (it.sizes) price = it.sizes.map(([s, p]) => `<small>${s}</small>${peso(p)}`).join("");
  else if (it.p == null) price = "₱ 확인필요";
  else price = peso(it.p);
  return `<div class="card${it.check ? " check" : ""}">
    <div class="ph"><img src="${src(it.img)}" alt="${esc(it.ko)}">${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}</div>
    <div class="row"><span class="ko">${esc(it.ko)}</span><span class="price">${price}</span></div>
    <div class="en">${esc(it.en)}</div>
    ${it.incl ? `<div class="incl">+ ${esc(it.incl)}</div>` : ""}
  </div>`;
}

function itemHTML(it) {
  const shake = it.shake
    ? `<div class="shake">${it.shake.map(([k, e]) => `<span>${k}<small>${e}</small></span>`).join("")}</div>` : "";
  return `<div class="item">
    <span class="ko">${esc(it.ko)}</span><span class="dots"></span>
    <span class="price"><span class="cur">₱</span>${it.p.toLocaleString("en-US")}</span>
    <div class="en">${esc(it.en)}</div>${shake}
  </div>`;
}

function groupHTML(g, sec) {
  const head = `<h3>${esc(g.ko)} <small>${esc(g.en)}</small></h3>`;
  let inner;
  if (g.addons) {
    inner = `<div class="addons">${g.addons.map(a =>
      `<div class="addon"><div>${esc(a.ko)}</div><small>${esc(a.en)}</small><b>+₱${a.p}</b></div>`).join("")}</div>`;
  } else if (sec.text) {
    inner = g.items.map(itemHTML).join("");
  } else {
    const style = `--cols:${g.cols || sec.cols || 4}${g.ratio ? `;--ratio:${g.ratio}` : ""}`;
    inner = `<div class="grid" style="${style}">${g.items.map(cardHTML).join("")}</div>`;
  }
  return `<section class="group">${head}${inner}</section>`;
}

function footHTML(n) {
  return `<div class="foot"><span class="brand">맛남의광장</span><span>TEL ${PHONE}</span><span>${n} / ${MENU.length}</span></div>`;
}

function pageHTML(sec, i) {
  const groups = sec.groups.map(g => groupHTML(g, sec)).join("");
  const strip = sec.strip
    ? `<div class="strip"><p>술 한잔엔 안주 한 접시<small>Pair it with our sides</small></p>
        <div class="imgs">${sec.strip.map(n => `<img src="${src(n)}" alt="">`).join("")}</div></div>` : "";
  return `<div class="page">
    <header class="head">
      <div class="no">— ${sec.no} —</div>
      <h2>${esc(sec.ko)}</h2>
      <div class="en">${esc(sec.en)}</div>
      <div class="rule"><span></span><i></i><span></span></div>
      ${sec.note ? `<div class="note">${esc(sec.note)}</div>` : ""}
    </header>
    <div class="body${sec.big ? " big" : ""}">${sec.text ? `<div class="cols2">${groups}</div>` : groups}${strip}</div>
    ${footHTML(i + 1)}
  </div>`;
}

function coverHTML() {
  const pics = ["daktoritang", "kimchi-rice", "jeyuk-rice", "tteokbokki", "budae", "kongnamul", "pajeon", "chik-mul", "sutbul", "veg-kimbap"];
  const toc = MENU.map(s => `<div><b>${s.ko}</b><small>${s.en.split(" ")[0]}</small></div>`).join("");
  return `<div class="page cover">
    <div class="mosaic">${pics.map(n => `<img src="${src(n)}" alt="">`).join("")}</div>
    <div class="inner">
      <div class="since">— Since 2019 —</div>
      <h1>맛남의광장</h1>
      <div class="tagline">Home of Quality Food</div>
      <div class="div"><span></span><i></i><span></span></div>
      <div class="toc">${toc}</div>
    </div>
    <div class="info"><span>TEL<b>${PHONE}</b><small>매일 08:00 – 24:00 · Open daily 8AM – 12MN<br>현금 결제만 가능 · Cash only</small></span>
      <div class="wifi"><img src="img/wifi-qr.svg" alt="Wi-Fi QR">
        <span>Wi-Fi<b>${WIFI}</b><small>비밀번호 입력 없이 QR 코드를 스캔해 연결하세요<br>Scan to join Wi-Fi</small></span></div></div>
  </div>`;
}

document.getElementById("menu").innerHTML = coverHTML() + MENU.map(pageHTML).join("");
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>하나로마트 · 사진 보고 바로 주문</title>
<meta name="description" content="상품 사진을 누르면 장바구니에 쏙! 카테고리·검색, Cash/GCash/Maya 결제, 영수증까지 한 번에. ShopOn 매장 앱 데모">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kimsungyong1117-jpg.github.io/shopon-mart-demo/">
<meta property="og:site_name" content="ShopOn">
<meta property="og:title" content="하나로마트 · 사진 보고 바로 주문하세요">
<meta property="og:description" content="사진 터치 → 장바구니 → 결제 → 영수증까지 1분! ShopOn이 만든 매장 앱 데모예요.">
<meta property="og:image" content="https://kimsungyong1117-jpg.github.io/shopon-mart-demo/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#064e2c">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f6f4ee; --card: #fff; --ink: #1b2420; --muted: #6e7671; --line: #e6e1d6;
    --green: #0b7a43; --green-dk: #064e2c; --green-soft: #e2f2e8;
    --red: #d92d20; --red-soft: #fde9e7; --orange: #f28c28;
    --shadow: 0 4px 14px rgba(20, 30, 25, .08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px; padding-bottom: calc(110px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  /* header */
  .hero {
    background: linear-gradient(120deg, var(--green-dk), var(--green));
    color: #fff; padding: 18px 16px 16px; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
    background: rgba(255, 255, 255, .07); right: -60px; top: -90px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .tag {
    background: #fff; color: var(--green-dk); font-weight: 700; font-size: 12px;
    padding: 4px 10px; border-radius: 999px;
  }
  .store { font-size: 26px; font-weight: 800; margin: 10px 0 2px; letter-spacing: -.01em; }
  .sub { font-size: 14px; color: #d6eedf; font-weight: 500; }
  .search {
    margin-top: 14px; display: flex; align-items: center; gap: 8px; background: #fff;
    border-radius: 14px; padding: 0 14px; height: 46px; position: relative; z-index: 1;
  }
  .search input {
    flex: 1; border: 0; outline: 0; font: inherit; font-size: 16px; color: var(--ink); background: transparent; min-width: 0;
  }
  .search .x { color: var(--muted); font-size: 18px; display: none; }

  /* category chips */
  .chips {
    position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 8px;
    overflow-x: auto; padding: 12px 16px; scrollbar-width: none;
    border-bottom: 1px solid transparent; transition: border-color .2s;
  }
  .chips.stuck { border-color: var(--line); }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 9px 15px; border-radius: 999px; background: var(--card);
    font-weight: 600; font-size: 14px; color: var(--muted); box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .chip.on { background: var(--green); color: #fff; }
  .chip .n { font-weight: 500; opacity: .7; margin-left: 3px; font-size: 12px; }

  /* product grid */
  .count { padding: 4px 18px 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .card {
    background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column; position: relative; transition: transform .12s, box-shadow .2s;
    outline: 2px solid transparent; outline-offset: -2px;
  }
  .card:active { transform: scale(.98); }
  .card.in { outline-color: var(--green); }
  .card.out { opacity: .55; }
  .ph { aspect-ratio: 1; background: #eee; position: relative; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stock {
    align-self: flex-start; font-size: 12px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green);
  }
  .stock.low { background: var(--red); color: #fff; }
  .stock.none { background: #444; color: #fff; }
  .qbadge {
    position: absolute; right: 8px; top: 8px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px;
    background: var(--green); color: #fff; font-weight: 800; font-size: 14px; display: none;
    align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .card.in .qbadge { display: flex; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .name {
    font-weight: 600; font-size: 14px; line-height: 1.35; min-height: 2.7em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
  .price { font-weight: 800; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
  .price small { font-weight: 600; font-size: 12px; color: var(--muted); margin-left: 1px; }
  .add {
    width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff;
    font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .step { display: flex; align-items: center; background: var(--green-soft); border-radius: 999px; flex: 0 0 auto; }
  .step button { width: 30px; height: 32px; font-size: 18px; font-weight: 700; color: var(--green); }
  .step span { min-width: 26px; text-align: center; font-weight: 800; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-weight: 500; }

  /* cart bar */
  .bar {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20;
    background: var(--green-dk); color: #fff; border-radius: 18px; height: 62px; padding: 0 8px 0 18px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(6, 78, 44, .35);
    transform: translateY(140%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .bar.show { transform: none; }
  .bar .ic { font-size: 22px; position: relative; }
  .bar .ic b {
    position: absolute; right: -9px; top: -6px; background: var(--orange); font-size: 11px;
    min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  }
  .bar .t { flex: 1; font-size: 13px; color: #c8e6d4; line-height: 1.25; }
  .bar .t strong { display: block; color: #fff; font-size: 19px; font-weight: 800; }
  .bar .go { background: #fff; color: var(--green-dk); font-weight: 800; border-radius: 13px; padding: 13px 18px; font-size: 15px; }

  /* cart sheet */
  .dim { position: fixed; inset: 0; background: rgba(10, 20, 15, .45); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .dim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--bg); border-radius: 22px 22px 0 0;
    max-height: 88vh; display: flex; flex-direction: column; transform: translateY(105%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.show { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #cfc9bb; margin: 10px auto 4px; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px 10px; }
  .sh-head h2 { margin: 0; font-size: 21px; font-weight: 800; }
  .sh-head button { color: var(--red); font-weight: 600; font-size: 14px; }
  .lines { overflow-y: auto; padding: 0 16px; flex: 1; }
  .line { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 10px; margin-bottom: 8px; }
  .line img { width: 58px; height: 58px; border-radius: 12px; object-fit: cover; flex: 0 0 auto; }
  .line .mid { flex: 1; min-width: 0; }
  .line .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .up { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .line .lt { font-weight: 800; font-size: 15px; margin-top: 4px; }
  .pay { padding: 12px 16px 6px; }
  .pay h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  .methods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .m {
    background: var(--card); border-radius: 14px; padding: 11px 4px; text-align: center; font-weight: 700; font-size: 13px;
    border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .m i { font-style: normal; font-size: 20px; }
  .m.on { border-color: var(--green); background: var(--green-soft); color: var(--green-dk); }
  .sum { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px 4px; }
  .sum span { font-weight: 700; color: var(--muted); }
  .sum strong { font-size: 28px; font-weight: 800; color: var(--green); letter-spacing: -.01em; }
  .paybtn {
    margin: 10px 16px 14px; height: 58px; border-radius: 16px; background: var(--green); color: #fff;
    font-weight: 800; font-size: 18px; display: block; width: calc(100% - 32px);
  }
  .paybtn:disabled { background: #b8c4bd; }

  /* in-app receipt (link / browser launches) */
  .rc {
    position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; display: none;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .rc.show { display: block; animation: up .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .ok {
    width: 74px; height: 74px; border-radius: 50%; background: var(--green); color: #fff; font-size: 40px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; margin: 8px auto 14px; box-shadow: 0 8px 22px rgba(11,122,67,.35);
  }
  .rc h2 { text-align: center; margin: 0; font-size: 24px; font-weight: 800; }
  .rc .big { text-align: center; font-size: 38px; font-weight: 800; color: var(--green); margin: 6px 0 20px; letter-spacing: -.01em; }
  .paper { background: #fff; border-radius: 18px; padding: 20px 18px 22px; box-shadow: var(--shadow); border-top: 6px solid var(--green); }
  .paper .st { text-align: center; font-weight: 800; font-size: 20px; }
  .paper .ss { text-align: center; color: var(--muted); font-size: 12px; margin: 2px 0 12px; }
  .kv, .it { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 4px 0; }
  .kv span:first-child { color: var(--muted); }
  .dash { border-top: 2px dashed var(--line); margin: 10px 0; }
  .it b { font-weight: 600; }
  .it small { display: block; color: var(--muted); font-size: 12px; }
  .it .a { font-weight: 700; white-space: nowrap; }
  .tot { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 16px; }
  .tot strong { font-size: 24px; color: var(--green); }
  .thx { text-align: center; color: var(--green); font-weight: 700; margin-top: 14px; font-size: 14px; }
  .rc .note { color: var(--muted); font-size: 12.5px; text-align: center; margin: 22px 10px 14px; line-height: 1.5; }
  .again { height: 56px; border-radius: 16px; background: var(--green); color: #fff; font-weight: 800; font-size: 17px; width: 100%; }

  .toast {
    position: fixed; left: 50%; top: 18px; transform: translate(-50%, -150%); z-index: 50; background: var(--ink); color: #fff;
    padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 14px; transition: transform .25s; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="hero">
  <div class="brand"><span class="tag">ShopOn</span></div>
  <div class="store" id="store">Hanaro Mart</div>
  <div class="sub" id="sub"></div>
  <label class="search">🔎<input id="q" type="search" autocomplete="off"><button class="x" id="qx" type="button">✕</button></label>
</header>
<nav class="chips" id="chips"></nav>
<div class="count" id="count"></div>
<main class="grid" id="grid"></main>

<div class="bar" id="bar">
  <div class="ic">🧺<b id="barN">0</b></div>
  <div class="t"><span id="barL"></span><strong id="barT">₱0</strong></div>
  <button class="go" id="barGo"></button>
</div>

<div class="dim" id="dim"></div>
<section class="sheet" id="sheet" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="shTitle"></h2><button id="clear"></button></div>
  <div class="lines" id="lines"></div>
  <div class="pay"><h3 id="payTitle"></h3><div class="methods" id="methods"></div></div>
  <div class="sum"><span id="sumL"></span><strong id="sumT">₱0</strong></div>
  <button class="paybtn" id="payBtn"></button>
</section>
<section class="rc" id="rc"></section>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
// Only a mini app opened from the bot's keyboard button can send the sale back to the bot,
// and Telegram gives exactly those launches no initData. Opened from a plain link (or a
// browser), the page completes the sale itself and shows its own receipt.
const canSend = !!(tg && tg.platform && tg.platform !== "unknown" && !tg.initData);
const P = new URLSearchParams(location.search);
const LANG = P.get("lang") === "en" ? "en" : "ko";
const IMG = P.get("ib") || "https://raw.githubusercontent.com/kimsungyong1117-jpg/shopon-mart-demo/main/images/";

const L = {
  ko: { sub: "사진을 눌러 담고, 바로 결제하세요", search: "상품 검색 (예: 삼겹살, 콜라)", all: "전체",
        count: n => `상품 ${n}개`, stock: s => `재고 ${s}`, low: s => `부족 ${s}`, none: "품절",
        ea: "개", cartL: n => `${n}개 상품 담음`, go: "결제하기 →", title: "장바구니", clear: "전체 비우기",
        payTitle: "결제수단", sum: "합계", pay: t => `${t} 결제하기`, empty: "찾는 상품이 없어요 🥲",
        max: "재고가 부족해요", added: n => `${n} 담았어요`, paid: "결제 완료!", order: "주문번호", date: "일시", payBy: "결제", again: "새 주문 시작하기",
        thanks: "감사합니다 · Salamat po!", note: "실제 매장에서는 이 영수증과 매출이 봇과 마감 리포트에 자동으로 기록돼요" },
  en: { sub: "Tap a photo to add, then check out", search: "Search products", all: "All",
        count: n => `${n} products`, stock: s => `Stock ${s}`, low: s => `Low ${s}`, none: "Sold out",
        ea: "pc", cartL: n => `${n} items in cart`, go: "Checkout →", title: "Cart", clear: "Clear all",
        payTitle: "Payment method", sum: "Total", pay: t => `Pay ${t}`, empty: "No matching products 🥲",
        max: "Not enough stock", added: n => `Added ${n}`, paid: "Payment complete!", order: "Order", date: "Date", payBy: "Payment", again: "Start a new order",
        thanks: "Thank you · Salamat po!", note: "In a live store this sale also lands in the bot and the daily report automatically" },
}[LANG];
const METHODS = [["Cash", "💵"], ["GCash", "📱"], ["Maya", "💳"], ["Card", "🏦"]];

let DATA = null, cat = -1, query = "", method = "Cash";
const cart = new Map();          // id -> qty
const stock = {};                // id -> live stock passed by the bot

const $ = id => document.getElementById(id);
const money = x => "₱" + (Number.isInteger(x) ? x.toLocaleString("en-US")
                                              : x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const fmtQ = q => String(+q.toFixed(2));
const unit = p => p.u === "kg" ? "kg" : L.ea;
const step = p => p.u === "kg" ? 0.5 : 1;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const haptic = kind => { try { tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} };

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600);
}

function stockBadge(p) {
  const s = stock[p.id];
  if (s <= 0) return `<span class="stock none">${L.none}</span>`;
  const txt = fmtQ(s) + unit(p);
  return s <= p.min ? `<span class="stock low">${L.low(txt)}</span>` : `<span class="stock">${L.stock(txt)}</span>`;
}

function cardHTML(p) {
  const q = cart.get(p.id) || 0;
  const ctl = q ? `<div class="step"><button data-a="-">−</button><span>${fmtQ(q)}</span><button data-a="+">+</button></div>`
                : `<button class="add" data-a="+" aria-label="add">+</button>`;
  return `<article class="card${q ? " in" : ""}${stock[p.id] <= 0 ? " out" : ""}" data-id="${p.id}">
    <div class="ph"><img loading="lazy" src="${IMG}${p.img}" alt=""><span class="qbadge">${fmtQ(q)}${p.u === "kg" ? "kg" : ""}</span></div>
    <div class="info"><div class="name">${esc(p.n)}</div>${stockBadge(p)}
      <div class="row"><div class="price">${money(p.p)}${p.u === "kg" ? "<small>/kg</small>" : ""}</div>${ctl}</div></div>
  </article>`;
}

function visible() {
  const q = query.trim().toLowerCase();
  return DATA.products.filter(p => (cat < 0 || p.c === cat) && (!q || p.n.toLowerCase().includes(q)));
}

function renderGrid() {
  const list = visible();
  $("grid").innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty" style="grid-column:1/-1">${L.empty}</div>`;
  $("count").textContent = L.count(list.length);
}

function renderChips() {
  const counts = DATA.categories.map((_, i) => DATA.products.filter(p => p.c === i).length);
  $("chips").innerHTML = [`<button class="chip${cat < 0 ? " on" : ""}" data-c="-1">${L.all}</button>`]
    .concat(DATA.categories.map((c, i) => `<button class="chip${cat === i ? " on" : ""}" data-c="${i}">${esc(c[LANG])}<span class="n">${counts[i]}</span></button>`))
    .join("");
}

function refreshCard(id) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) el.outerHTML = cardHTML(DATA.byId[id]);
}

function total() { let t = 0; cart.forEach((q, id) => t += DATA.byId[id].p * q); return Math.round(t * 100) / 100; }

function renderBar() {
  const n = cart.size;
  $("bar").classList.toggle("show", n > 0);
  $("barN").textContent = n;
  $("barL").textContent = L.cartL(n);
  $("barT").textContent = money(total());
}

function change(id, dir) {
  const p = DATA.byId[id];
  const cur = cart.get(id) || 0;
  let next = Math.round((cur + dir * step(p)) * 100) / 100;
  if (next > stock[id]) { toast(L.max); try { tg.HapticFeedback.notificationOccurred("error"); } catch (e) {} return; }
  if (next <= 0) cart.delete(id); else cart.set(id, next);
  if (dir > 0 && cur === 0) toast(L.added(p.n));
  haptic(dir > 0 ? "light" : "soft");
  refreshCard(id); renderBar();
  if ($("sheet").classList.contains("show")) renderSheet();
}

function renderSheet() {
  const lines = [...cart.entries()].map(([id, q]) => {
    const p = DATA.byId[id];
    return `<div class="line" data-id="${id}"><img src="${IMG}${p.img}" alt="">
      <div class="mid"><div class="nm">${esc(p.n)}</div><div class="up">${money(p.p)} / ${unit(p)}</div><div class="lt">${money(p.p * q)}</div></div>
      <div class="step"><button data-a="-">−</button><span>${fmtQ(q)}</span><button data-a="+">+</button></div></div>`;
  });
  $("lines").innerHTML = lines.join("");
  $("methods").innerHTML = METHODS.map(([m, i]) => `<button class="m${m === method ? " on" : ""}" data-m="${m}"><i>${i}</i>${m}</button>`).join("");
  $("sumT").textContent = money(total());
  $("payBtn").textContent = L.pay(money(total()));
  $("payBtn").disabled = cart.size === 0;
  if (!cart.size) closeSheet();
}

function openSheet() { renderSheet(); $("dim").classList.add("show"); $("sheet").classList.add("show"); haptic("medium"); }
function closeSheet() { $("dim").classList.remove("show"); $("sheet").classList.remove("show"); }

function pay() {
  if (!cart.size) return;
  const payload = JSON.stringify({ t: "sale", pay: method, items: [...cart.entries()] });
  try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  if (canSend) {
    tg.sendData(payload);       // closes the mini app; the bot replies with the receipt
  } else {
    showReceipt();
  }
}

let orderNo = 18 + Math.floor(Math.random() * 6);

function showReceipt() {
  const items = [...cart.entries()].map(([id, q]) => [DATA.byId[id], q]);
  const sum = total();
  items.forEach(([p, q]) => { stock[p.id] = Math.round((stock[p.id] - q) * 100) / 100; });
  orderNo += 1;
  const d = new Date();
  const when = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ` +
               `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  $("rc").innerHTML = `<div class="ok">✓</div><h2>${L.paid}</h2><div class="big">${money(sum)}</div>
    <div class="paper">
      <div class="st">${esc($("store").textContent)}</div><div class="ss">ShopOn POS</div>
      <div class="kv"><span>${L.order}</span><span>#${String(orderNo).padStart(4, "0")}</span></div>
      <div class="kv"><span>${L.date}</span><span>${when}</span></div>
      <div class="dash"></div>
      ${items.map(([p, q]) => `<div class="it"><div><b>${esc(p.n)}</b><small>${fmtQ(q)}${unit(p)} × ${money(p.p)}</small></div>
        <div class="a">${money(p.p * q)}</div></div>`).join("")}
      <div class="dash"></div>
      <div class="tot"><span>${L.sum}</span><strong>${money(sum)}</strong></div>
      <div class="kv" style="margin-top:6px"><span>${L.payBy}</span><span>${method}</span></div>
      <div class="thx">${L.thanks}</div>
    </div>
    <p class="note">${L.note}</p>
    <button class="again" id="again">${L.again}</button>`;
  closeSheet();
  $("toast").classList.remove("show");
  $("rc").classList.add("show");
  $("rc").scrollTop = 0;
  $("again").addEventListener("click", () => {
    cart.clear(); renderGrid(); renderBar(); $("rc").classList.remove("show"); window.scrollTo({ top: 0 });
  });
}

function bind() {
  $("grid").addEventListener("click", e => {
    const card = e.target.closest(".card"); if (!card) return;
    const id = +card.dataset.id; const btn = e.target.closest("[data-a]");
    if (btn) change(id, btn.dataset.a === "+" ? 1 : -1);
    else if (stock[id] > 0) change(id, 1);
  });
  $("lines").addEventListener("click", e => {
    const btn = e.target.closest("[data-a]"); if (!btn) return;
    change(+btn.closest(".line").dataset.id, btn.dataset.a === "+" ? 1 : -1);
  });
  $("chips").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    cat = +c.dataset.c; renderChips(); renderGrid(); haptic("light");
    c.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    window.scrollTo({ top: Math.min(window.scrollY, $("chips").offsetTop), behavior: "smooth" });
  });
  $("methods").addEventListener("click", e => {
    const m = e.target.closest(".m"); if (!m) return;
    method = m.dataset.m; renderSheet(); haptic("light");
  });
  $("q").addEventListener("input", e => { query = e.target.value; $("qx").style.display = query ? "block" : "none"; renderGrid(); });
  $("qx").addEventListener("click", () => { $("q").value = ""; query = ""; $("qx").style.display = "none"; renderGrid(); });
  $("bar").addEventListener("click", openSheet);
  $("dim").addEventListener("click", closeSheet);
  $("clear").addEventListener("click", () => { [...cart.keys()].forEach(id => { cart.delete(id); refreshCard(id); }); renderBar(); closeSheet(); });
  $("payBtn").addEventListener("click", pay);
  new IntersectionObserver(([e]) => $("chips").classList.toggle("stuck", !e.isIntersecting), { threshold: 0 })
    .observe(document.querySelector(".hero"));
}

async function main() {
  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor("#064e2c"); tg.setBackgroundColor("#f6f4ee"); } catch (e) {}
  }
  $("store").textContent = P.get("store") || "Hanaro Mart";
  document.title = $("store").textContent + " · ShopOn";
  $("sub").textContent = L.sub;
  $("q").placeholder = L.search;
  $("barGo").textContent = L.go;
  $("shTitle").textContent = L.title;
  $("clear").textContent = L.clear;
  $("payTitle").textContent = L.payTitle;
  $("sumL").textContent = L.sum;

  DATA = await (await fetch("products.json", { cache: "no-cache" })).json();
  DATA.byId = {};
  DATA.products.forEach(p => DATA.byId[p.id] = p);
  // Live stock arrives from the bot as "s" = comma-separated values in id order.
  const s = (P.get("s") || "").split(",");
  DATA.products.forEach((p, i) => { const v = parseFloat(s[i]); stock[p.id] = isNaN(v) ? p.s : v; });
  renderChips(); renderGrid(); renderBar(); bind();
}
main();
</script>

# 위키미디어 공용에서 봉화 관광지 사진 후보를 받아 tools/photo-candidates/에 커밋합니다.
name: Fetch Bonghwa photo candidates

on:
  push:
    branches: [ccr-2fa5efbb-1tt6pg]
    paths:
      - "tools/fetch_commons.py"
      - "tools/survey_commons.py"
      - "tools/fetch_selected.py"
      - ".github/workflows/fetch-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_selected.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jagalmadang/images/places
          git commit -m "봉화 관광지 사진 후보 받기" || exit 0
          git push

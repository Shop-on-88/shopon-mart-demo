# 한국관광공사 사진 출처 접근 점검 (일회성)
name: Probe KTO photo sources
on:
  push:
    branches: [ccr-2fa5efbb-1tt6pg]
    paths: ["tools/probe_kto.sh", ".github/workflows/probe-kto.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe_kto.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe && git commit -m "관광공사 사진 출처 점검 결과" && git push || true

<style>
  /* 인쇄 규격: A4 세로. 가격·품목 수정은 아래 MENU 데이터만 고치면 됩니다. */
  @page { size: A4; margin: 0; }
  :root {
    --paper: #f5eee1;
    --paper-deep: #ebe0cc;
    --ink: #1f1b17;
    --muted: #6f655a;
    --line: #cbbda5;
    --red: #b8322a;
    --red-soft: #f1d9d2;
    --gold: #a77b2c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #8d8476; }
  body {
    font-family: "Noto Sans KR", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page {
    width: 210mm; height: 297mm;
    margin: 10mm auto;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    padding: 16mm 15mm 14mm;
    display: flex; flex-direction: column;
    box-shadow: 0 4px 24px rgba(0,0,0,.25);
  }
  @media print {
    html { background: none; }
    .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
  }
  /* 테두리 장식 */
  .page::before {
    content: ""; position: absolute; inset: 7mm;
    border: 0.4mm solid var(--line); pointer-events: none;
  }
  .page::after {
    content: ""; position: absolute; inset: 8.4mm;
    border: 0.15mm solid var(--line); pointer-events: none;
  }

  /* ---------- 섹션 헤더 ---------- */
  .head { text-align: center; margin-bottom: 7mm; }
  .head .no {
    font-family: "Cormorant Garamond", serif; font-style: italic;
    color: var(--gold); font-size: 13pt; letter-spacing: .5px;
  }
  .head h2 {
    font-family: "Noto Serif KR", serif; font-weight: 900;
    font-size: 30pt; letter-spacing: 6px; line-height: 1.15;
  }
  .head .en {
    font-family: "Cormorant Garamond", serif; font-weight: 600;
    font-size: 12pt; letter-spacing: 6px; color: var(--red); text-transform: uppercase;
  }
  .head .rule {
    display: flex; align-items: center; gap: 3mm; justify-content: center; margin-top: 3mm;
  }
  .head .rule span { height: .3mm; width: 22mm; background: var(--ink); }
  .head .rule i { width: 2.2mm; height: 2.2mm; background: var(--red); transform: rotate(45deg); }
  .head .note { margin-top: 2.5mm; font-size: 8.5pt; color: var(--muted); }

  /* ---------- 본문 ---------- */
  .body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; column-gap: 11mm; align-content: start; }
  .body.one { grid-template-columns: 1fr; }
  .group { break-inside: avoid; margin-bottom: 6.5mm; }
  .group.span { grid-column: 1 / -1; }
  .group h3 {
    display: flex; align-items: baseline; gap: 2.5mm;
    font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 13pt;
    padding-bottom: 1.6mm; margin-bottom: 2.6mm;
    border-bottom: .45mm solid var(--ink);
  }
  .group h3 small {
    font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 10pt;
    letter-spacing: 2.5px; color: var(--red); text-transform: uppercase;
  }
  .group .gnote { font-size: 8pt; color: var(--muted); margin: -1.2mm 0 2.4mm; }

  .item { display: grid; grid-template-columns: auto 1fr auto; align-items: end; column-gap: 2mm; padding: 1.55mm 0; }
  .item .ko { font-weight: 700; font-size: 11pt; white-space: nowrap; }
  .item .dots { border-bottom: .35mm dotted var(--line); transform: translateY(-1.6mm); }
  .item .price { font-weight: 700; font-size: 11pt; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .price .cur { font-weight: 500; font-size: 8.5pt; color: var(--muted); margin-right: .6mm; }
  .item .sub { grid-column: 1 / -1; display: flex; gap: 2mm; align-items: baseline; margin-top: .3mm; }
  .item .en { font-size: 7.6pt; letter-spacing: .6px; color: var(--muted); text-transform: uppercase; }
  .item .tag {
    font-size: 6.8pt; font-weight: 700; color: var(--red); border: .25mm solid var(--red);
    border-radius: 1mm; padding: 0 1.2mm; line-height: 1.5; white-space: nowrap;
  }
  .item .tag.fill { background: var(--red); color: #fff; }
  .item.size .price { display: flex; gap: 3mm; }
  .item.size .price b { font-weight: 500; font-size: 7.5pt; color: var(--muted); margin-right: .8mm; }
  .item.soldout .ko, .item.soldout .en { color: #a99d8c; text-decoration: line-through; text-decoration-thickness: .2mm; }
  .item.check .price { background: #ffe58a; padding: 0 1mm; }

  /* 큰 카드형 (요리 페이지) */
  .feature .item { padding: 2.2mm 0; }
  .feature .item .ko { font-size: 12.5pt; }
  .feature .item .price { font-size: 12.5pt; }

  /* 추가 옵션 칩 */
  .addons { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6mm 6mm; }
  .addon { display: flex; justify-content: space-between; font-size: 9.5pt; border-bottom: .2mm solid var(--line); padding: 1mm 0; }
  .addon span:first-child small { display: block; font-size: 6.8pt; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
  .addon b { font-weight: 700; color: var(--red); align-self: center; }

  .shake { display: flex; flex-wrap: wrap; gap: 1.6mm; margin-top: 1mm; }
  .shake span { font-size: 8.8pt; background: var(--paper-deep); border-radius: 5mm; padding: .7mm 2.6mm; }
  .shake span small { color: var(--muted); font-size: 7pt; margin-left: 1mm; text-transform: uppercase; }

  /* ---------- 하단 ---------- */
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 8pt; color: var(--muted); border-top: .25mm solid var(--line); padding-top: 2.2mm; margin-top: auto;
  }
  .foot .brand { font-family: "Nanum Brush Script", cursive; font-size: 16pt; color: var(--ink); line-height: 1; }

  /* ---------- 표지 ---------- */
  .cover { background: #1f1b17; color: var(--paper); padding: 0; }
  .cover::before, .cover::after { border-color: rgba(245,238,225,.35); }
  .cover .inner {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 20mm;
  }
  .cover .since {
    font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 15pt; letter-spacing: 4px; color: #d8b26a;

  .cover .seal {
    width: 22mm; height: 22mm; border-radius: 3mm; background: var(--red); color: #fff;
    display: grid; place-items: center; font-family: "Noto Serif KR", serif; font-weight: 900;
    font-size: 11pt; line-height: 1.15; margin-bottom: 9mm; transform: rotate(-4deg);

    font-family: "Nanum Brush Script", cursive; font-weight: 400;

  .cover .tagline {
    font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 14pt; letter-spacing: 7px; text-transform: uppercase;

  .cover .div i { width: 2.4mm; height: 2.4mm; background: var(--red); transform: rotate(45deg); }
  .cover .toc { display: grid; grid-template-columns: repeat(3, auto); gap: 3mm 10mm; font-size: 10.5pt; }

  .cover .toc small { font-family: "Cormorant Garamond", serif; color: #d8b26a; letter-spacing: 1.5px; font-size: 9.5pt; text-transform: uppercase; }
  .cover .info {

  }

/* ─── 렌더링 ─────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const won = n => n.toLocaleString("en-US");

function itemHTML(it) {
  const cls = ["item"];
  if (it.sizes) cls.push("size");
  if (it.soldout) cls.push("soldout");
  if (it.check) cls.push("check");
  let price;
  if (it.soldout) price = "";
  else if (it.sizes) price = it.sizes.map(([s, p]) => `<span><b>${s}</b>₱${won(p)}</span>`).join("");
  else if (it.p == null) price = `<span class="cur">₱</span>확인필요`;
  else price = `<span class="cur">₱</span>${won(it.p)}`;
  const tags = (it.tags || []).map(t => `<span class="tag${t === "NEW" || t === "BEST" ? " fill" : ""}">${esc(t)}</span>`);
  if (it.soldout) tags.push(`<span class="tag">품절 · SOLD OUT</span>`);
  const shake = it.shake
    ? `<div class="shake" style="grid-column:1/-1">${it.shake.map(([k, e]) => `<span>${k}<small>${e}</small></span>`).join("")}</div>` : "";
  return `<div class="${cls.join(" ")}">
    <span class="ko">${esc(it.ko)}</span><span class="dots"></span><span class="price">${price}</span>
    <div class="sub"><span class="en">${esc(it.en)}</span>${tags.join("")}</div>${shake}
  </div>`;
}

function groupHTML(g) {
  const head = `<h3>${esc(g.ko)} <small>${esc(g.en)}</small></h3>`;
  let inner;
  if (g.addons) {
    inner = `<div class="addons">${g.addons.map(a =>
      `<div class="addon"><span>${esc(a.ko)}<small>${esc(a.en)}</small></span><b>+₱${a.p}</b></div>`).join("")}</div>`;
  } else if (g.cols) {
    const half = Math.ceil(g.items.length / 2);
    inner = `<div style="display:grid;grid-template-columns:1fr 1fr;column-gap:11mm">
      <div>${g.items.slice(0, half).map(itemHTML).join("")}</div>
      <div>${g.items.slice(half).map(itemHTML).join("")}</div></div>`;
  } else {
    inner = g.items.map(itemHTML).join("");
  }
  return `<section class="group${g.span ? " span" : ""}">${head}${inner}</section>`;
}

function footHTML(n) {
  return `<div class="foot"><span class="brand">맛남의광장</span><span>TEL ${PHONE}</span><span>${n} / ${MENU.length}</span></div>`;
}

function pageHTML(sec, i) {
  return `<div class="page">
    <header class="head">
      <div class="no">— ${sec.no} —</div>
      <h2>${esc(sec.ko)}</h2>
      <div class="en">${esc(sec.en)}</div>
      <div class="rule"><span></span><i></i><span></span></div>
      ${sec.note ? `<div class="note">${esc(sec.note)}</div>` : ""}
    </header>
    <div class="body${sec.feature ? " feature" : ""}">${sec.groups.map(groupHTML).join("")}</div>
    ${footHTML(i + 1)}
  </div>`;
}

function coverHTML() {
  const toc = MENU.map(s => `<div><b>${s.ko}</b><small>${s.en.split(" ")[0]}</small></div>`).join("");
  return `<div class="page cover">
    <div class="inner">
      <div class="seal">한국<br>음식</div>
      <div class="since">— Since 2019 —</div>
      <h1>맛남의광장</h1>
      <div class="tagline">Home of Quality Food</div>
      <div class="div"><span></span><i></i><span></span></div>
      <div class="toc">${toc}</div>
    </div>
    <div class="info"><span>TEL<b>${PHONE}</b></span><span>Wi-Fi<b>${WIFI}</b></span></div>
  </div>`;
}

document.getElementById("menu").innerHTML = coverHTML() + MENU.map(pageHTML).join("");
</script>
</body>
</html>
